services:
  db:
    image: postgres:16-alpine
    container_name: runway-db
    environment:
      POSTGRES_USER: runway
      POSTGRES_PASSWORD: runway
      POSTGRES_DB: runway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runway -d runway"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: runway-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://runway:runway@db:5432/runway
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: runway-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
